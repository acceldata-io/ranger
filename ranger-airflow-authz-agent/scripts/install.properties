#
# Install settings for the Ranger Airflow plugin.
#
# Unlike every other Ranger plugin, the decision point here is a SEPARATE
# JVM process (the authz agent) running beside the Airflow api-server,
# not a jar loaded into the service. Airflow is Python and cannot load a
# Java plugin in-process.
#
# Install this on API-SERVER nodes only. The scheduler, workers, triggerer
# and dag-processor never consult the auth manager -- they talk to the
# Execution API with task identities.
#

# ---------------------------------------------------------------------
# Ranger Admin
# ---------------------------------------------------------------------
POLICY_MGR_URL=
REPOSITORY_NAME=

# Name recorded on every audit record. Use the ODP cluster name so audits
# from two clusters pointed at one Ranger can be told apart.
CLUSTER_NAME=

# Airflow's install root. The enable script resolves conf and lib paths
# beneath this.
COMPONENT_INSTALL_DIR_NAME=airflow

# ---------------------------------------------------------------------
# Agent identity
#
# The principal the agent presents to Ranger Admin AND to Solr. It needs
# three grants that are easy to miss:
#
#   1. policy.download.auth.users     on the Ranger service
#   2. userstore.download.auth.users  on the Ranger service -- a SEPARATE
#      key. Policy download succeeds without it and the agent still never
#      becomes ready, because use.only.rangerGroups makes the user store
#      mandatory.
#   3. ranger_audit_user in infra-solr security.json, keyed on the SHORT
#      principal (name@REALM). Without it audits spool to disk forever
#      with no error raised.
# ---------------------------------------------------------------------
AGENT_PRINCIPAL=
AGENT_KEYTAB=

# Set false only for an unsecured cluster with no Kerberos.
AGENT_UGI_INITIALIZE=true

# ---------------------------------------------------------------------
# Agent process
#
# The agent binds loopback and refuses to start on any other address: the
# shared bearer token is its only authentication, so it must never be
# reachable off-host. The token file is generated by the enable script,
# mode 0400, owned by CUSTOM_USER.
# ---------------------------------------------------------------------
AGENT_PORT=9183
AGENT_TOKEN_FILE=/etc/ranger/airflow/agent.token
AGENT_THREAD_POOL_SIZE=16

# JRE used to run the agent. The agent is a self-contained shaded jar, so
# this needs no classpath beyond the conf directory.
AGENT_JAVA_HOME=

# ---------------------------------------------------------------------
# Audit
# ---------------------------------------------------------------------
XAAUDIT.IS_ENABLED=true

XAAUDIT.SOLR.ENABLE=false
# Prefer ZOOKEEPER over URL; infra-solr moves, the ZK chroot does not.
XAAUDIT.SOLR.URL=
XAAUDIT.SOLR.ZOOKEEPER=NONE
XAAUDIT.SOLR.KERBEROS=true
XAAUDIT.SOLR.FILE_SPOOL_DIR=/var/log/airflow/audit/solr/spool

# ---------------------------------------------------------------------
# SSL to Ranger Admin -- only used when POLICY_MGR_URL is https
# ---------------------------------------------------------------------
SSL_KEYSTORE_FILE_PATH=
SSL_KEYSTORE_PASSWORD=
SSL_TRUSTSTORE_FILE_PATH=
SSL_TRUSTSTORE_PASSWORD=

# ---------------------------------------------------------------------
# File ownership
# ---------------------------------------------------------------------
CUSTOM_USER=airflow
CUSTOM_GROUP=airflow
