# Agent-specific settings. Ranger plugin settings live in the three XML files
# beside this one (ranger-airflow-security.xml, ranger-airflow-audit.xml,
# ranger-policymgr-ssl.xml) — those follow Ranger's plugin convention.
#
# Put this directory on the JVM classpath ahead of the agent jar:
#   java -cp /etc/ranger-airflow-authz-agent/conf:ranger-airflow-authz-agent.jar \
#        io.acceldata.airflow.ranger.RangerAirflowAuthzAgent \
#        /etc/ranger-airflow-authz-agent/conf/authz-agent.properties

# Loopback only. The agent refuses to start on a non-loopback bind.
authz.agent.bind.address=127.0.0.1
authz.agent.port=9183

# Shared secret. File must be 0400, owned by the Airflow service user, at least
# 32 bytes. Generate with: openssl rand -hex 32
authz.agent.token.file=/etc/airflow/ranger-authz-agent.token

# Cluster name for audit records is NOT set here -- it comes from
# ranger.plugin.airflow.access.cluster.name in ranger-airflow-security.xml,
# the standard Ranger key, read via the plugin's own RangerPluginConfig.

authz.agent.thread.pool.size=16

# Must match the service-def "name" field.
authz.agent.service.type=airflow
authz.agent.app.id=airflow

# Advertised on GET /v1/info. Client refuses to start outside this range.
authz.agent.supported.airflow=>=3.2,<3.3

# hadoop.security.auth_to_local rules for turning a Kerberos principal into the
# short name Ranger's usersync holds. Leave blank to use whatever Hadoop loaded
# from a core-site.xml on the agent classpath, which is the normal case on a
# Kerberized cluster.
#
# When no rule applies the agent falls back to stripping the realm, logging a
# warning once. That is correct for the common case and wrong for a cluster
# whose rules rewrite names or map cross-realm principals -- set this if yours
# does. Verify with:
#
#   curl -H "Authorization: Bearer $(cat <token-file>)" \
#        "http://127.0.0.1:9183/v1/whoami?principal=alice@REALM"
#
hadoop.security.auth_to_local=
