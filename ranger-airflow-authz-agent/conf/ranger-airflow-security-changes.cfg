#
# Substitutions applied to ranger-airflow-security.xml by
# XmlConfigChanger when enable-airflow-plugin.sh runs. Each %NAME% is a
# key read from install.properties.
#
# Format:  <property name>  <value>  <mod|add>  <create-if-not-exists>
#
ranger.plugin.airflow.service.name                          %REPOSITORY_NAME%                                   mod create-if-not-exists
ranger.plugin.airflow.policy.source.impl                    org.apache.ranger.admin.client.RangerAdminRESTClient mod create-if-not-exists
ranger.plugin.airflow.policy.rest.url                       %POLICY_MGR_URL%                                    mod create-if-not-exists
ranger.plugin.airflow.policy.rest.ssl.config.file           ranger-policymgr-ssl.xml                            mod create-if-not-exists
ranger.plugin.airflow.policy.pollIntervalMs                 30000                                               mod create-if-not-exists
ranger.plugin.airflow.policy.cache.dir                      %POLICY_CACHE_FILE_PATH%                            mod create-if-not-exists
ranger.plugin.airflow.policy.rest.client.connection.timeoutMs 120000                                            mod create-if-not-exists
ranger.plugin.airflow.policy.rest.client.read.timeoutMs     30000                                               mod create-if-not-exists
ranger.plugin.airflow.access.cluster.name                   %CLUSTER_NAME%                                      mod create-if-not-exists
#
# Group resolution. use.only.rangerGroups makes Ranger's user store the
# single source of group membership, which is what a Kerberos deployment
# needs -- a ticket carries no groups. It also makes the user store
# load-bearing: the agent reports not-ready until it downloads, and the
# service needs userstore.download.auth.users to permit that.
#
ranger.plugin.airflow.use.rangerGroups                      true                                                mod create-if-not-exists
ranger.plugin.airflow.use.only.rangerGroups                 true                                                mod create-if-not-exists
#
# The identity the agent presents to Ranger Admin and to Solr.
#
ranger.plugin.airflow.ugi.initialize                        %AGENT_UGI_INITIALIZE%                              mod create-if-not-exists
ranger.plugin.airflow.ugi.login.type                        keytab                                              mod create-if-not-exists
ranger.plugin.airflow.ugi.keytab.principal                  %AGENT_PRINCIPAL%                                   mod create-if-not-exists
ranger.plugin.airflow.ugi.keytab.file                       %AGENT_KEYTAB%                                      mod create-if-not-exists
