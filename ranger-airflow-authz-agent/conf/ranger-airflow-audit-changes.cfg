# Substitutions applied to ranger-airflow-audit.xml by XmlConfigChanger.
#
xasecure.audit.is.enabled                                      %XAAUDIT.IS_ENABLED%        mod create-if-not-exists
xasecure.audit.destination.log4j                               true                        mod create-if-not-exists
xasecure.audit.destination.hdfs                                false                       mod create-if-not-exists
#
# Solr. Prefer ZooKeeper discovery over a fixed URL: infra-solr moves and
# the ZK chroot does not.
#
xasecure.audit.destination.solr                                %XAAUDIT.SOLR.ENABLE%       mod create-if-not-exists
xasecure.audit.destination.solr.urls                           %XAAUDIT.SOLR.URL%          mod create-if-not-exists
xasecure.audit.destination.solr.zookeepers                     %XAAUDIT.SOLR.ZOOKEEPER%    mod create-if-not-exists
xasecure.audit.destination.solr.collection                     ranger_audits               mod create-if-not-exists
xasecure.audit.destination.solr.batch.filespool.dir            %XAAUDIT.SOLR.FILE_SPOOL_DIR% mod create-if-not-exists
xasecure.audit.destination.solr.async.max.queue.size           10240                       mod create-if-not-exists
xasecure.audit.destination.solr.async.max.flush.interval.ms    1000                        mod create-if-not-exists
#
# Kerberos for Solr. force.use.inmemory.jaas.config keeps the JAAS entry
# in process rather than requiring a java.security.auth.login.config file.
#
# NOTE the agent principal must also be registered in infra-solr's
# security.json as ranger_audit_user, or every audit silently spools to
# disk with no error. Nothing in this script does that -- see the
# deployment prerequisites ticket.
#
xasecure.audit.destination.solr.force.use.inmemory.jaas.config %XAAUDIT.SOLR.KERBEROS%     mod create-if-not-exists
xasecure.audit.jaas.Client.loginModuleName                     com.sun.security.auth.module.Krb5LoginModule mod create-if-not-exists
xasecure.audit.jaas.Client.loginModuleControlFlag              required                    mod create-if-not-exists
xasecure.audit.jaas.Client.option.useKeyTab                    true                        mod create-if-not-exists
xasecure.audit.jaas.Client.option.storeKey                     false                       mod create-if-not-exists
xasecure.audit.jaas.Client.option.serviceName                  solr                        mod create-if-not-exists
xasecure.audit.jaas.Client.option.keyTab                       %AGENT_KEYTAB%              mod create-if-not-exists
xasecure.audit.jaas.Client.option.principal                    %AGENT_PRINCIPAL%           mod create-if-not-exists
